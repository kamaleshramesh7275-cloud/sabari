services:
  - type: web
    name: senseguard-dashboard
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*.glb
        name: Content-Type
        value: model/gltf-binary
